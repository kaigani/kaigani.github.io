<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Studio Kaigani</title>

        <meta name="description" content="Studio Kaigani: original stories, short films and series by Kaigani.">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <meta property="og:title" content="Studio Kaigani">
        <meta property="og:description" content="Original stories, short films and series by Kaigani.">
        <meta property="og:image" content="https://kaigani.github.io/studio/assets/showreel-poster.jpg">
        <meta property="og:type" content="website">

        <link rel="icon" href="../favicon.ico">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="assets/studio.css">
    </head>
    <body>

        <header class="masthead">
            <h1>
                <img src="assets/studio-kaigani-logo.jpg" width="1672" height="520"
                     alt="Studio Kaigani — スタジオ・カイガニ">
            </h1>
        </header>

        <main>

            <section class="reel" aria-labelledby="reel-title">
                <div class="section-head">
                    <h2 id="reel-title">Showreel</h2>
                    <span class="tag">2025–2026</span>
                </div>
                <div class="frame">
                    <video controls playsinline preload="metadata"
                           poster="assets/showreel-poster.jpg?v=2" width="1920" height="1080">
                        <source src="assets/showreel.mp4" type="video/mp4">
                        Your browser doesn't support HTML video.
                        <a href="assets/showreel.mp4">Download the showreel</a>.
                    </video>
                </div>
            </section>

            <section class="channel" aria-labelledby="channel-title">
                <div class="section-head">
                    <h2 id="channel-title">From the channel</h2>
                    <a class="tag link" href="https://www.youtube.com/@kaigani">youtube.com/@kaigani &rarr;</a>
                </div>
                <div class="grid">
                    <figure>
                        <div class="frame">
                            <iframe src="https://www.youtube-nocookie.com/embed/1ZwsGnrgZtk?rel=0"
                                    title="He Found the Secret of the Rings... And It's Terrifying"
                                    loading="lazy" allowfullscreen
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                    referrerpolicy="strict-origin-when-cross-origin"></iframe>
                        </div>
                        <figcaption>The Secret of the Rings</figcaption>
                    </figure>
                    <figure>
                        <div class="frame">
                            <iframe src="https://www.youtube-nocookie.com/embed/7bkPssw99qs?rel=0"
                                    title="Cyberpunk in Brazil, FAV3LA, set in a futuristic Rio de Janeiro"
                                    loading="lazy" allowfullscreen
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                    referrerpolicy="strict-origin-when-cross-origin"></iframe>
                        </div>
                        <figcaption>FAV3LA</figcaption>
                    </figure>
                    <figure>
                        <div class="frame">
                            <iframe src="https://www.youtube-nocookie.com/embed/jq8KLjz6OMc?rel=0"
                                    title="A Case of the Mondays | A Short Film by Kaigani"
                                    loading="lazy" allowfullscreen
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                    referrerpolicy="strict-origin-when-cross-origin"></iframe>
                        </div>
                        <figcaption>A Case of the Mondays</figcaption>
                    </figure>
                </div>
            </section>

            <section class="coming-soon" aria-labelledby="soon-title">
                <div class="section-head">
                    <h2 id="soon-title">Coming soon</h2>
                    <span class="tag red">Showrunner</span>
                </div>
                <img src="assets/showrunner-coming-soon.jpg" width="1402" height="1122" loading="lazy"
                     alt="Showrunner — coming soon: The Secret of the Rings, SKNWLKRS, Hellmouth Cowboy and FAV3LA">
                <ul class="slate">
                    <li>The Secret of the Rings</li>
                    <li>SKNWLKRS</li>
                    <li>Hellmouth Cowboy</li>
                    <li>FAV3LA</li>
                </ul>
            </section>

        </main>

        <footer>
            <a href="../">kaigani turner</a>
            <a href="https://www.youtube.com/@kaigani">youtube</a>
            <a href="https://linkedin.com/in/kaigani">linkedin</a>
        </footer>

    </body>
</html>
